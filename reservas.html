<!DOCTYPE html>
<html>
    <head>
        <link rel="icon" href="imagen_logo/reserva.jpeg" type="image/x-icon">
        <title>Reservar</title>
    </head>
    <body>
        <h1>Reservar tu mesa en El Cristal Dorado</h1>

        <form>
            <label for="nombre">Escribe tu nombre completo</label><br>
            <input type="text" id="nombre" placeholder="Nombre Completo"><br><br>

            <label for="personas">¿Cuántas personas son?</label><br>
            <input type="number" id="personas" min="1" max="10" value="1"><br><br>

            <label for="hora_llegada">Hora estimada de llegada:</label><br>
            <input type="time" id="hora_llegada"><br><br>

            <button type="submit">Enviar Reservación</button>
        </form>
    </body>
</html>
